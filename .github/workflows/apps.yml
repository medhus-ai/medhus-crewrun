name: Desktop and headless packages

on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/**', 'src/**', 'bin/**', 'scripts/**', 'packages/**', 'package*.json', '.github/workflows/apps.yml']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-latest
            bundle: nsis
          - os: macos-15
            bundle: dmg
          - os: macos-15-intel
            bundle: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'
          cache: npm
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
          # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor, which
          # WebKitGTK's web-process sandbox needs. Allow them rather than disabling the sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: node --test test/app-runtime.test.js test/platform.test.js test/platform-doctor.test.js
      - name: Test actual browser login form
        if: runner.os == 'Linux'
        run: node scripts/smoke-browser.mjs /usr/bin/google-chrome
      - name: Stage locked application and native Node runtime
        run: node scripts/stage-app.mjs apps/desktop/payload
      - name: Smoke test without system Node/npm
        run: node scripts/smoke-app.mjs apps/desktop/payload
      - name: Build and test display-free launcher
        working-directory: apps/desktop
        run: |
          cargo test --locked --release --no-default-features
          cargo build --locked --release --no-default-features
      - name: Archive headless app
        run: node scripts/archive-app.mjs headless
      - name: Compile desktop and build unsigned tester installer
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          cargo test --locked --release
          npx --yes @tauri-apps/cli@2.11.5 build --bundles ${{ matrix.bundle }}
      - name: Archive desktop app
        run: node scripts/archive-app.mjs desktop
      - name: Test real Linux webview
        if: runner.os == 'Linux'
        # GPU-less runners: WebKitGTK's DMA-BUF renderer and compositing can hang under Xvfb.
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          NO_AT_BRIDGE: '1'
        run: xvfb-run -a node scripts/smoke-window.mjs apps/desktop/CrewRun
      - name: Test real Windows webview
        if: runner.os == 'Windows'
        run: node scripts/smoke-window.mjs apps/desktop/CrewRun.exe
      - name: Test real macOS webview
        if: runner.os == 'macOS'
        run: node scripts/smoke-window.mjs apps/desktop/CrewRun
      - uses: actions/upload-artifact@v4
        with:
          name: CrewRun-${{ runner.os }}-${{ runner.arch }}-unsigned
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/releases/*
            apps/desktop/target/release/bundle/**/*.deb
            apps/desktop/target/release/bundle/**/*.dmg
            apps/desktop/target/release/bundle/**/*.exe

# Distribution is intentionally artifacts-only. No npm publishing, deployment,
# automatic public release, signing credentials or live provider tests in PRs.
