name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Node 20
            os: ubuntu-latest
            node: 20
          - name: Linux / Node 24
            os: ubuntu-latest
            node: 24
          - name: Windows / Node 20
            os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        shell: bash
      - run: npm test
