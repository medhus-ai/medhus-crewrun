name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Node 20
            os: ubuntu-latest
            node: 20
          - name: Linux / Node 24
            os: ubuntu-latest
            node: 24
          - name: Windows / Node 20
            os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Node 20 bundles node-gyp 10, which cannot detect VS 2026 on windows-latest.
      # npm 11.6.3 includes node-gyp 12.1; use a supported Python for its source builds.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - run: npm install --global npm@11.6.3
        if: runner.os == 'Windows'
      - run: npm ci
        shell: bash
      - run: npm test
