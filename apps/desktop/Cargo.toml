[package]
name = "crewrun-app"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
description = "Thin native window and headless launcher for the shared CrewRun runtime"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:open", "dep:cookie"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[dependencies]
serde_json = "1.0"
tauri = { version = "=2.11.6", optional = true }
open = { version = "5.3", optional = true }
cookie = { version = "=0.18.2", optional = true }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[[bin]]
name = "CrewRun"
path = "src/main.rs"
